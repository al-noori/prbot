[package]
name = "prbot"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/al-noori/prbot"
description = "Slack bot that reviews GitHub PRs requesting your review with Claude. Never approves or merges."

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
